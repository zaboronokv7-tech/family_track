<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d17"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Задачи">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><title>Семейные задачи</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:15px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;color:#e8eaf6;background:#0b0d17 radial-gradient(60% 40% at 10% 0,#4a35b588,transparent) fixed;min-height:100vh}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(45% 35% at 100% 35%,#0e8aa866,transparent),radial-gradient(50% 40% at 0 100%,#a02a7a55,transparent)}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;margin:5px 0;padding:11px 13px;border-radius:12px;border:1px solid #ffffff22;background:#ffffff12;outline:0}
input:focus,select:focus,textarea:focus{border-color:#8f7bff}select option{background:#1b1d33}
label{display:block;color:#aab0d0;font-size:13px;margin-top:6px}
.g{background:rgba(255,255,255,.07);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.13);border-radius:18px}
.card{padding:14px;margin:10px 0}.m{color:#9aa1c4;font-size:13px}.sp{flex:1}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
header{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:#0b0d17aa;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
header select{width:auto;max-width:45%;margin:0}
main{max-width:720px;margin:auto;padding:4px 14px calc(100px + env(safe-area-inset-bottom))}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:696px;margin:auto;display:flex;padding:6px;z-index:5}
nav button{flex:1;background:0;border:0;border-radius:14px;padding:7px 4px;color:#9aa1c4;position:relative}nav button.on{background:#ffffff1c;color:#fff}
.bd{position:absolute;top:2px;right:18%;background:#ff4d6d;color:#fff;border-radius:9px;padding:0 6px;font-size:11px}
.btn{background:linear-gradient(135deg,#7c5cff,#2ec4f1);border:0;border-radius:12px;padding:10px 16px;font-weight:600;color:#fff;margin-top:6px}
.ghost{background:#ffffff14;border:1px solid #ffffff22;border-radius:12px;padding:8px 12px}
.tabs{display:flex;gap:6px;margin:10px 0;overflow:auto}.tabs button{flex:1;white-space:nowrap;background:#ffffff0e;border:1px solid #ffffff1a;border-radius:12px;padding:8px 10px}.tabs button.on{background:#7c5cff55;border-color:#8f7bff}
.tk{cursor:pointer}.chip{font-size:12px;padding:2px 9px;border-radius:9px;background:#ffffff18}.chip.high{background:#ff4d6d44}.over{color:#ff6b81}.soon{color:#ffc04d}
.fab{position:fixed;right:20px;bottom:calc(86px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;border:0;font-size:28px;color:#fff;background:linear-gradient(135deg,#7c5cff,#2ec4f1);box-shadow:0 8px 24px #7c5cff66;z-index:6}
#sheet{position:fixed;inset:0;display:none;background:#0009;z-index:20;align-items:flex-end;justify-content:center}#sheet.on{display:flex}
.pane{width:100%;max-width:720px;max-height:92vh;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0;background:rgba(22,24,44,.9);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid #ffffff1f}
#th{max-height:30vh;overflow:auto;margin:8px 0}.msg{background:#ffffff12;border-radius:14px;padding:8px 12px;margin:6px 40px 6px 0}.msg.me{margin:6px 0 6px 40px;background:#7c5cff44}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translate(-50%,-150%);transition:.3s;background:#20233fee;border:1px solid #ffffff30;border-radius:14px;padding:10px 16px;z-index:50;max-width:90%}#toast.on{transform:translate(-50%,0)}
.auth{max-width:380px;margin:12vh auto;padding:22px}h1,h3{margin:0 0 6px}
</style></head><body><div id="app"></div><div id="sheet"></div><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const URL_='https://qjgjwavttmpwzwqoxhpv.supabase.co',KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFqZ2p3YXZ0dG1wd3p3cW94aHB2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1MTAxNzgsImV4cCI6MjEwOTA4NjE3OH0.f8vpX2w8iMwSgz6e1iCTUvJ8n0_79fr8uwtMF0Atzzk';
const sb=supabase.createClient(URL_,KEY);
const $=s=>document.querySelector(s),h=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ST={new:'Новая',work:'В работе',review:'На проверке',done:'Закрыта'},PR={low:'Низкий',mid:'Обычный',high:'Срочно'};
let me,P={},fams=[],cur,tasks=[],invs=[],fr=[],tab='tasks',flt='mine',openId=null,mode='in',thm='c';
const toast=t=>{const e=$('#toast');e.textContent=t;e.className='on';setTimeout(()=>e.className='',3500)};
const fmt=d=>d?new Date(d).toLocaleString('ru',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'—';
const nm=id=>P[id]?.name||'—',em=()=>me.email.toLowerCase();
const inInv=()=>invs.filter(x=>x.email.toLowerCase()==em()),inFr=()=>fr.filter(x=>x.status=='pending'&&x.addressee_email.toLowerCase()==em());
const friendIds=()=>fr.filter(x=>x.status=='accepted').map(x=>x.requester==me.id?Object.values(P).find(u=>u.email==x.addressee_email.toLowerCase())?.id:x.requester).filter(Boolean);
const members=()=>cur?cur.family_members.map(m=>P[m.user_id]).filter(Boolean):[];
const dl=t=>{if(!t.deadline||t.status=='done')return'';const d=new Date(t.deadline)-Date.now();return d<0?'over':d<864e5?'soon':''};

function authView(){$('#app').innerHTML=`<div class="auth g"><h1>Семейные задачи</h1><p class=m>${mode=='in'?'Войдите в аккаунт':'Создайте аккаунт'}</p>${mode=='up'?'<input id=n placeholder="Ваше имя">':''}<input id=e type=email placeholder="Почта" autocomplete=email><input id=p type=password placeholder="Пароль (от 6 символов)"><button class=btn onclick=auth()>${mode=='in'?'Войти':'Зарегистрироваться'}</button> <button class=ghost onclick="mode=mode=='in'?'up':'in';authView()">${mode=='in'?'Нет аккаунта?':'Уже есть аккаунт'}</button></div>`}
async function auth(){const e=$('#e').value.trim().toLowerCase(),p=$('#p').value;let r;
if(mode=='in')r=await sb.auth.signInWithPassword({email:e,password:p});
else{r=await sb.auth.signUp({email:e,password:p,options:{data:{name:$('#n').value.trim()||e.split('@')[0]}}});
if(!r.error&&!r.data.session)return toast('Мы отправили письмо: подтвердите почту и войдите')}
if(r.error)return toast(r.error.message);start(r.data.user)}

async function load(){
const [p,f,i,r]=await Promise.all([sb.from('profiles').select('*'),sb.from('families').select('*,family_members(user_id)').order('created_at',{ascending:false}),sb.from('invitations').select('*').eq('status','pending'),sb.from('friendships').select('*')]);
P=Object.fromEntries((p.data||[]).map(x=>[x.id,x]));fams=f.data||[];invs=i.data||[];fr=r.data||[];
cur=fams.find(x=>cur&&x.id==cur.id)||fams[0]||null;tasks=[];
if(cur){const t=await sb.from('tasks').select('*,task_watchers(user_id)').eq('family_id',cur.id).order('created_at',{ascending:false});tasks=t.data||[]}}
async function start(u){me=u;await load();render();sb.channel('rt').on('postgres_changes',{event:'*',schema:'public'},onChange).subscribe();
const n=tasks.filter(t=>t.assignee==me.id&&dl(t)).length;if(n)toast(`⏰ Задач с горящим дедлайном: ${n}`)}
async function onChange(p){const t=p.table,n=p.new||{},ins=p.eventType=='INSERT';
if(t=='invitations'&&ins&&(n.email||'').toLowerCase()==em())toast('📨 Вас приглашают в семью');
if(t=='friendships'&&ins&&(n.addressee_email||'').toLowerCase()==em())toast('🤝 Новая заявка в друзья');
if(t=='task_comments'&&ins&&n.user_id!=me.id)toast('💬 Новое сообщение в задаче');
if(t=='tasks'&&ins&&n.assignee==me.id&&n.author!=me.id)toast('📌 Вам назначена задача');
if(t=='task_comments'||t=='task_events'){if(openId&&$('#th'))thr();return}
await load();render();if(openId&&t=='tasks')taskView()}

function render(){const bd={fam:inInv().length,fr:inFr().length};
$('#app').innerHTML=`<header><select onchange="pick(this.value)">${fams.map(f=>`<option value="${f.id}" ${cur?.id==f.id?'selected':''}>${h(f.name)}</option>`).join('')||'<option>Нет семьи</option>'}</select><span class=sp></span><span class=m>${h(nm(me.id))}</span><button class=ghost onclick="sb.auth.signOut().then(()=>location.reload())">Выйти</button></header><main>${tab=='tasks'?tasksV():tab=='fam'?famV():frV()}</main><nav class=g>${[['tasks','✓','Задачи'],['fam','🏠','Семьи'],['fr','🤝','Друзья']].map(([k,i,l])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';render()">${i}<br>${l}${bd[k]?`<b class=bd>${bd[k]}</b>`:''}</button>`).join('')}</nav>`}
async function pick(id){cur=fams.find(f=>f.id==id);await load();render()}

function tasksV(){if(!cur)return`<div class="g card">Создайте свою семью или примите приглашение на вкладке «Семьи».</div>`;
const l=tasks.filter(t=>flt=='done'?t.status=='done':t.status!='done'&&(flt=='all'||t.assignee==me.id||t.task_watchers.some(w=>w.user_id==me.id)));
return`<div class=tabs>${[['mine','Мои'],['all','Все'],['done','Закрытые']].map(([k,v])=>`<button class="${flt==k?'on':''}" onclick="flt='${k}';render()">${v}</button>`).join('')}</div>${l.map(t=>`<div class="g card tk" onclick="openTask('${t.id}')"><div class=row><b>${h(t.title)}</b><span class="chip ${t.priority}">${PR[t.priority]}</span></div><div class=m>Исполнитель: ${h(nm(t.assignee))} · <span class="${dl(t)}">${fmt(t.deadline)}</span> · ${ST[t.status]}</div></div>`).join('')||'<p class=m>Здесь пока нет задач. Нажмите ＋, чтобы создать первую.</p>'}<button class=fab onclick=newTask()>＋</button>`}

function famV(){return`${inInv().map(i=>`<div class="g card"><b>Приглашение в семью «${h(i.family_name)}»</b><div class=row><button class=btn onclick="accept('${i.id}')">Принять</button><button class=ghost onclick="decline('${i.id}')">Отклонить</button></div></div>`).join('')}<div class="g card"><b>Новая семья</b><input id=fn placeholder="Название"><button class=btn onclick=mkFam()>Создать семью</button></div>${cur?`<div class="g card"><b>${h(cur.name)}</b><p class=m>Участники: ${members().map(m=>h(m.name)).join(', ')}</p><input id=ie type=email placeholder="Почта для приглашения"><button class=btn onclick=invite()>Пригласить</button></div>`:''}`}
async function mkFam(){const n=$('#fn').value.trim();if(!n)return;const r=await sb.from('families').insert({name:n});if(r.error)return toast(r.error.message);cur=null;await load();render()}
async function invite(){const e=$('#ie').value.trim().toLowerCase();if(!e)return;const r=await sb.from('invitations').insert({family_id:cur.id,email:e,family_name:cur.name});toast(r.error?r.error.message:'Приглашение отправлено');$('#ie').value=''}
async function accept(id){const r=await sb.rpc('accept_invitation',{inv:id});if(r.error)return toast(r.error.message);await load();render()}
async function decline(id){await sb.from('invitations').update({status:'declined'}).eq('id',id);await load();render()}

function frV(){const ids=friendIds();return`${inFr().map(x=>`<div class="g card row"><span>${h(nm(x.requester))} хочет дружить</span><span><button class=btn onclick="frAns('${x.id}','accepted')">Принять</button> <button class=ghost onclick="frAns('${x.id}','declined')">✕</button></span></div>`).join('')}<div class="g card"><b>Добавить друга</b><input id=fe type=email placeholder="Почта друга"><button class=btn onclick=addFr()>Отправить заявку</button></div><div class="g card"><b>Мои друзья</b>${ids.map(i=>`<div>${h(nm(i))} <span class=m>${h(P[i].email)}</span></div>`).join('')||'<p class=m>Друзей пока нет. Добавьте человека по почте: задачи можно назначать только друзьям.</p>'}</div>`}
async function addFr(){const e=$('#fe').value.trim().toLowerCase();if(!e||e==em())return;const r=await sb.from('friendships').insert({addressee_email:e});toast(r.error?'Заявка уже отправлена или произошла ошибка':'Заявка отправлена');$('#fe').value='';await load();render()}
async function frAns(id,s){await sb.from('friendships').update({status:s}).eq('id',id);await load();render()}

function sheet(html){const s=$('#sheet');s.innerHTML='<div class=pane>'+html+'</div>';s.classList.add('on');s.onclick=e=>{if(e.target.id=='sheet')closeSheet()}}
function closeSheet(){$('#sheet').classList.remove('on');openId=null}
function newTask(){const c=members().filter(m=>m.id==me.id||friendIds().includes(m.id)),o=m=>`<option value="${m.id}">${h(m.name)}</option>`;
sheet(`<h3>Новая задача</h3><input id=tt placeholder="Название"><textarea id=td rows=3 placeholder="Описание"></textarea><label>Дедлайн<input id=tdl type=datetime-local></label><label>Приоритет<select id=tp><option value=mid>Обычный</option><option value=high>Срочно</option><option value=low>Низкий</option></select></label><label>Исполнитель (вы или друг из семьи)<select id=ta>${c.map(o).join('')}</select></label><label>Наблюдатели<select id=tw multiple>${c.filter(m=>m.id!=me.id).map(o).join('')}</select></label><button class=btn onclick=saveTask()>Создать задачу</button>`)}
async function saveTask(){const t=$('#tt').value.trim();if(!t)return toast('Введите название задачи');const d=$('#tdl').value;
const r=await sb.from('tasks').insert({family_id:cur.id,title:t,description:$('#td').value,deadline:d?new Date(d).toISOString():null,priority:$('#tp').value,assignee:$('#ta').value}).select().single();
if(r.error)return toast(r.error.message);
const w=[...$('#tw').selectedOptions].map(o=>({task_id:r.data.id,user_id:o.value}));if(w.length)await sb.from('task_watchers').insert(w);
closeSheet();await load();render()}

function openTask(id){openId=id;thm='c';taskView()}
function taskView(){const t=tasks.find(x=>x.id==openId);if(!t)return closeSheet();
sheet(`<div class=row><h3>${h(t.title)}</h3><button class=ghost onclick=closeSheet()>✕</button></div><p>${h(t.description)||'<span class=m>Без описания</span>'}</p><div class=m>Автор: ${h(nm(t.author))}<br>Исполнитель: ${h(nm(t.assignee))}<br>Дедлайн: <span class="${dl(t)}">${fmt(t.deadline)}</span> · ${PR[t.priority]}<br>Наблюдатели: ${t.task_watchers.map(w=>h(nm(w.user_id))).join(', ')||'нет'}</div><div class=tabs>${Object.entries(ST).map(([k,v])=>`<button class="${t.status==k?'on':''}" onclick="setSt('${t.id}','${k}')">${v}</button>`).join('')}</div><div class=tabs><button id=b1 onclick="thr('c')">Чат</button><button id=b2 onclick="thr('h')">История</button></div><div id=th></div><div id=cf class=row><input id=cm placeholder="Сообщение" onkeydown="if(event.key=='Enter')send()"><button class=btn onclick=send()>➤</button></div>`);thr()}
async function thr(m){thm=m||thm;$('#b1').classList.toggle('on',thm=='c');$('#b2').classList.toggle('on',thm=='h');$('#cf').style.display=thm=='c'?'flex':'none';
const r=thm=='c'?await sb.from('task_comments').select('*').eq('task_id',openId).order('created_at'):await sb.from('task_events').select('*').eq('task_id',openId).order('created_at'),el=$('#th');if(!el)return;
el.innerHTML=(r.data||[]).map(x=>thm=='c'?`<div class="msg ${x.user_id==me.id?'me':''}"><small class=m>${h(nm(x.user_id))} · ${fmt(x.created_at)}</small><br>${h(x.body)}</div>`:`<div class=m style="margin:6px 0">${fmt(x.created_at)} · ${h(nm(x.user_id))}: ${h(x.text)}</div>`).join('')||'<p class=m>Пока пусто</p>';el.scrollTop=el.scrollHeight}
async function send(){const b=$('#cm').value.trim();if(!b)return;$('#cm').value='';await sb.from('task_comments').insert({task_id:openId,body:b});thr()}
async function setSt(id,s){await sb.from('tasks').update({status:s}).eq('id',id);await load();render();taskView()}

if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
(async()=>{const{data:{session}}=await sb.auth.getSession();session?start(session.user):authView()})();
</script></body></html>
